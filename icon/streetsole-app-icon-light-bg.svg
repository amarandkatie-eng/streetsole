<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!--
    STREETSOLE App Icon — Light Background Variant
    For use in contexts requiring a lighter icon treatment.
  -->

  <!-- Background — white -->
  <rect width="1024" height="1024" rx="224" fill="#ffffff"/>

  <!-- Subtle grid -->
  <rect x="0" y="330" width="1024" height="4" fill="#e5e7eb" rx="2"/>
  <rect x="0" y="510" width="1024" height="4" fill="#e5e7eb" rx="2"/>
  <rect x="0" y="690" width="1024" height="4" fill="#e5e7eb" rx="2"/>
  <rect x="330" y="0" width="4" height="1024" fill="#e5e7eb" rx="2"/>
  <rect x="510" y="0" width="4" height="1024" fill="#e5e7eb" rx="2"/>
  <rect x="690" y="0" width="4" height="1024" fill="#e5e7eb" rx="2"/>

  <!-- Exploration path -->
  <polyline
    points="160,860 332,860 332,692 512,692 512,512 692,512 692,332 860,332"
    stroke="#059669"
    stroke-width="56"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none" />

  <!-- Glow -->
  <polyline
    points="160,860 332,860 332,692 512,692 512,512 692,512 692,332 860,332"
    stroke="#10b981"
    stroke-width="90"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    opacity="0.1" />

  <!-- Current position -->
  <circle cx="860" cy="332" r="44" fill="#059669"/>
  <circle cx="860" cy="332" r="28" fill="#10b981"/>
  <circle cx="860" cy="332" r="14" fill="#d1fae5"/>

  <!-- Starting point -->
  <circle cx="160" cy="860" r="20" fill="#059669" opacity="0.35"/>
</svg>
